name: Publish fork to npm (@ahmedrowaihi)

on:
  push:
    branches:
      - publish-ahmedrowaihi
  workflow_dispatch:
    inputs:
      promote_version:
        description: >-
          Move `beta` onto this already-published version instead of publishing a new one.
          Use it when a run went green but the tag never moved because npm had not served
          every package yet. Leave empty for a normal publish.
        required: false
        type: string

permissions:
  contents: write
  id-token: write # Mint the OIDC token npm trades for a short-lived publish credential
  actions: read # Read Fork CI's conclusion for this commit, which gates the whole job

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Vanilagy/mediabunny.git
          git fetch upstream main --depth=1000

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: https://registry.npmjs.org

      - name: Use an npm that speaks OIDC
        # Node 22 bundles npm 10.x; trusted publishing needs 11.5.1 or newer.
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        # --ignore-scripts skips node-av's postinstall (its binary-check fails
        # on this runner). The package itself still installs so TypeScript can
        # resolve its types when scripts/build.sh runs `tsc -p packages/server`.
        # Fork publishes only the root @ahmedrowaihi/mediabunny — node-av never
        # enters the published tarball.
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Require a green Fork CI for this commit
        # The test suite cannot run in this job: the install above is `--ignore-scripts`, so node-av has
        # no native binary here. `fork-ci.yml` runs the tests, and this waits for its verdict on the same
        # commit rather than publishing in parallel with it.
        #
        # Three red versions reached `latest` before this existed (680, 684, 685). Two things let that
        # happen: this job ran only the type, lint and build gates, never the tests; and the catch-up
        # promotion was its *first* step, so it moved tags before any gate had run. The gate is now first
        # and the catch-up follows it, so a red commit publishes nothing — which also keeps `pending` from
        # ever naming a red version for a later run to promote.
        #
        # A `workflow_run` trigger would be tidier, but GitHub only fires those for workflow files on the
        # default branch, and this one lives on the release branch.
        if: ${{ !inputs.promote_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 180); do
            line=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/fork-ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion // "")"' 2>/dev/null || echo "")
            status="${line%% *}"
            conclusion="${line#* }"
            # `.workflow_runs[0]` renders as the string "null" before the run exists, not as empty
            [ "$status" = "null" ] && status=""


            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Fork CI is green for ${GITHUB_SHA}."
                break
              fi
              echo "::error::Fork CI concluded '${conclusion}' for ${GITHUB_SHA}. Publishing nothing and moving no tag."
              exit 1
            fi

            echo "Fork CI is '${status:-not started}' for ${GITHUB_SHA} (attempt ${attempt}/180); waiting."
            sleep 20
          done

          if [ "$status" != "completed" ]; then
            echo "::error::Fork CI did not conclude within an hour. Publishing nothing and moving no tag."
            exit 1
          fi

      - name: Catch up the tags on the last complete release
        # npm can take 25 minutes to serve every package — longer than the publishing run waits — so a
        # release whose set completed after its own run ended would stay on `pending` forever. This is the
        # only automatic catch-up there is, so every run promotes whatever `pending` has become complete
        # since. It runs *after* the CI gate: before, it moved tags for a commit whose tests had failed.
        # Never fails the run: there is a new version to publish either way.
        if: ${{ !inputs.promote_version }}
        continue-on-error: true
        run: npx tsx scripts/publish-fork.ts --catch-up

      - name: Check types, lint and the deletion guard
        # A version number is spent the moment a publish is accepted, so the tree is checked before one is.
        # These need no native binary, unlike the test suite, which fork-ci.yml runs with scripts installed.
        if: ${{ !inputs.promote_version }}
        run: |
          npm run check
          npm run lint

      - name: Build
        run: npm run build

      - name: Check the docs generate
        if: ${{ !inputs.promote_version }}
        run: npm run docs:generate -- --dry

      - name: Resolve beta-stamped version
        id: ver
        run: |
          # Read the base from upstream rather than from our own manifest. Ours is a copy that only changes
          # when someone remembers to bump it, and it silently fell two patches behind — we published
          # 1.61.4-beta.N while building on upstream 1.61.6, which reads as "based on 1.61.4" to anyone
          # comparing. Taking it from the rebase target means the base is right by construction.
          PROMOTE="${{ inputs.promote_version }}"
          if [ -n "$PROMOTE" ]; then
            VERSION="$PROMOTE"
            BASE="${PROMOTE%%-beta.*}"
          else
            BASE=$(git show upstream/main:package.json | jq -r '.version' | sed -E 's/-beta(\.[0-9]+)?$//')
            VERSION="${BASE}-beta.${{ github.run_number }}"
          fi
          UPSTREAM_SHA=$(git rev-parse --short upstream/main)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          npm version --no-git-tag-version "${VERSION}"
          # Only the root manifest is stamped here, for the release notes and the tag. Every published name,
          # version and peer range is set by scripts/publish-fork.mjs at publish time, so the working tree keeps
          # upstream's package names and stays diff-free against upstream.

      - name: Generate release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BASE: ${{ steps.ver.outputs.base }}
          UPSTREAM_SHA: ${{ steps.ver.outputs.upstream_sha }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "**Published:** \`@ahmedrowaihi/mediabunny@${VERSION}\` on npm (dist-tag: \`beta\`)"
            echo ""
            echo "**Upstream base:** [\`Vanilagy/mediabunny@${UPSTREAM_SHA}\`](https://github.com/Vanilagy/mediabunny/commit/${UPSTREAM_SHA}) (mediabunny \`${BASE}\`)"
            echo ""
            echo "### Install"
            echo ""
            echo '```bash'
            echo "npm install @ahmedrowaihi/mediabunny@${VERSION}"
            echo '```'
            echo ""
            echo "### Quick start — fork-specific features"
            echo ""
            echo '**DASH input — read MPEG-DASH manifests just like HLS:**'
            echo ""
            echo '```ts'
            echo "import { Input, DASH_FORMATS, UrlSource } from '@ahmedrowaihi/mediabunny';"
            echo ""
            echo "const input = new Input({"
            echo "  source: new UrlSource('https://example.com/manifest.mpd'),"
            echo "  formats: DASH_FORMATS,"
            echo "});"
            echo "const tracks = await input.getTracks();"
            echo '```'
            echo ""
            echo '**Standalone parsers (no `Input` overhead — just AST inspection):**'
            echo ""
            echo '```ts'
            echo "import { parseMpd, parseHlsPlaylist } from '@ahmedrowaihi/mediabunny';"
            echo ""
            echo "const mpd = parseMpd(xml);"
            echo "console.log(mpd.periods[0].adaptationSets[0].representations);"
            echo ""
            echo "const playlist = parseHlsPlaylist(m3u8Text);"
            echo "if (playlist.kind === 'master') {"
            echo "  for (const variant of playlist.variants) {"
            echo "    console.log(variant.bandwidth, variant.codecs, variant.resolution);"
            echo "  }"
            echo "}"
            echo '```'
            echo ""
            echo '**Stitch per-chunk manifests into one (chunked-encoding pipelines):**'
            echo ""
            echo '```ts'
            echo "import { concatMpdPeriods, concatHlsMediaPlaylists } from '@ahmedrowaihi/mediabunny';"
            echo ""
            echo "const { xml, totalDurationSeconds } = concatMpdPeriods(["
            echo "  { xml: chunk0Mpd, baseURL: 'chunks/0/' },"
            echo "  { xml: chunk1Mpd, baseURL: 'chunks/1/' },"
            echo "]);"
            echo ""
            echo "const { content } = concatHlsMediaPlaylists(["
            echo "  { content: chunk0Playlist, pathPrefix: 'chunks/0' },"
            echo "  { content: chunk1Playlist, pathPrefix: 'chunks/1' },"
            echo "]);"
            echo '```'
            echo ""
            echo '**HLS + DASH from one CMAF pass:**'
            echo ""
            echo '```ts'
            echo "import {"
            echo "  Output, BufferTarget,"
            echo "  AdaptiveOutputFormat, HlsOutputFormat, DashOutputFormat,"
            echo "} from '@ahmedrowaihi/mediabunny';"
            echo ""
            echo "const output = new Output({"
            echo "  format: new AdaptiveOutputFormat({"
            echo "    hls: new HlsOutputFormat({ /* ... */ }),"
            echo "    dash: new DashOutputFormat({ /* ... */ }),"
            echo "  }),"
            echo "  target: new BufferTarget(),"
            echo "});"
            echo '```'
            echo ""
            echo "### Fork commits ahead of upstream"
            echo ""
            git log "--pretty=format:- %s ([\`%h\`](https://github.com/${REPO}/commit/%H))" upstream/main..HEAD
            echo ""
            echo ""
            echo "### Fork feature index"
            echo ""
            echo "See [FORK.md](https://github.com/${REPO}/blob/${SHA}/FORK.md) for the categorised list of additions (DASH input, parser exports, concat APIs, etc.)."
          } > release-notes.md

      - name: Publish all fork packages
        id: publish
        if: ${{ !inputs.promote_version }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: npx tsx scripts/publish-fork.ts --version "${VERSION}" --tag beta --if-complete

      - name: Promote an already-published version
        id: promote
        if: ${{ inputs.promote_version }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: npx tsx scripts/publish-fork.ts --version "${VERSION}" --tag beta --promote-only

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Re-running a run is normal here: npm can take hours to serve a package, and the promotion step is
          # re-run once it does. `gh release create` is the one step that is not idempotent — a second attempt
          # fails with 422 "Release.tag_name already exists" after the publish and the tag move have both
          # succeeded, turning a correct release red.
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; updating its notes."
            gh release edit "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --notes-file release-notes.md \
              --prerelease
          else
            # The target can be gone by the time this runs: the publish waits on npm, and a force-push in the
            # meantime orphans the commit, which GitHub answers with a 403 that reads like a token problem.
            # Retry against the branch, and if even that fails say so without failing a release npm already has.
            gh release create "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --title "v${VERSION}" \
              --notes-file release-notes.md \
              --prerelease \
              --target "${{ github.sha }}" \
            || gh release create "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --title "v${VERSION}" \
              --notes-file release-notes.md \
              --prerelease \
            || echo "::warning title=No GitHub Release::v${VERSION} is on npm but its release could not be created."
          fi

      - name: Prune older beta releases (keep latest 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: 3
        run: |
          # gh release list returns prereleases in createdAt desc order. Slice off the newest
          # $KEEP via bash array indexing, delete the rest. Bash array slicing avoids the
          # fragile `env.X|tonumber` jq syntax that silently misbehaves across jq versions.
          mapfile -t betas < <(
            gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease) | .tagName'
          )
          echo "Found ${#betas[@]} prerelease(s); keeping newest ${KEEP}."
          if [ "${#betas[@]}" -le "${KEEP}" ]; then
            echo "Nothing to prune."
            exit 0
          fi
          for tag in "${betas[@]:${KEEP}}"; do
            echo "Pruning $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          done

      - name: Summary
        # always(): an incomplete set now fails the publish step, and the summary is the only place that
        # names which packages are missing and how to finish the release.
        if: always()
        run: |
          {
            echo "## Published \`@ahmedrowaihi/mediabunny@${{ steps.ver.outputs.version }}\`"
            echo ""
            if [ "${{ steps.publish.outputs.promoted }}${{ steps.promote.outputs.promoted }}" = "false" ]; then
              echo "- **npm dist-tag:** NOT moved; it still points at the last complete set."
              echo "  - not served yet: \`${{ steps.publish.outputs.missing }}${{ steps.promote.outputs.missing }}\`"
              echo "  - re-run this workflow with \`promote_version\` once they appear."
            else
              echo "- **npm dist-tag:** \`beta\`"
            fi
            echo "- **upstream base:** \`${{ steps.ver.outputs.upstream_sha }}\` (mediabunny \`${{ steps.ver.outputs.base }}\`)"
            echo "- **release:** https://github.com/${{ github.repository }}/releases/tag/v${{ steps.ver.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
