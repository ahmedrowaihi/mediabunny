name: Publish fork to npm (@ahmedrowaihi)

on:
  push:
    branches:
      - publish-ahmedrowaihi
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Vanilagy/mediabunny.git
          git fetch upstream main --depth=1000

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        # --ignore-scripts skips node-av's postinstall (its binary-check fails
        # on this runner). The package itself still installs so TypeScript can
        # resolve its types when scripts/build.sh runs `tsc -p packages/server`.
        # Fork publishes only the root @ahmedrowaihi/mediabunny — node-av never
        # enters the published tarball.
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Build
        run: npm run build

      - name: Resolve beta-stamped version
        id: ver
        run: |
          BASE=$(jq -r '.version' package.json | sed -E 's/-beta(\.[0-9]+)?$//')
          VERSION="${BASE}-beta.${{ github.run_number }}"
          UPSTREAM_SHA=$(git rev-parse --short upstream/main)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          npm version --no-git-tag-version "${VERSION}"

      - name: Generate release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BASE: ${{ steps.ver.outputs.base }}
          UPSTREAM_SHA: ${{ steps.ver.outputs.upstream_sha }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "**Published:** \`@ahmedrowaihi/mediabunny@${VERSION}\` on npm (dist-tag: \`beta\`)"
            echo ""
            echo "**Upstream base:** [\`Vanilagy/mediabunny@${UPSTREAM_SHA}\`](https://github.com/Vanilagy/mediabunny/commit/${UPSTREAM_SHA}) (mediabunny \`${BASE}\`)"
            echo ""
            echo "### Install"
            echo ""
            echo '```bash'
            echo "npm install @ahmedrowaihi/mediabunny@${VERSION}"
            echo '```'
            echo ""
            echo "### Quick start — fork-specific features"
            echo ""
            echo '**DASH input — read MPEG-DASH manifests just like HLS:**'
            echo ""
            echo '```ts'
            echo "import { Input, DASH_FORMATS, UrlSource } from '@ahmedrowaihi/mediabunny';"
            echo ""
            echo "const input = new Input({"
            echo "  source: new UrlSource('https://example.com/manifest.mpd'),"
            echo "  formats: DASH_FORMATS,"
            echo "});"
            echo "const tracks = await input.getTracks();"
            echo '```'
            echo ""
            echo '**Standalone parsers (no `Input` overhead — just AST inspection):**'
            echo ""
            echo '```ts'
            echo "import { parseMpd, parseHlsPlaylist } from '@ahmedrowaihi/mediabunny';"
            echo ""
            echo "const mpd = parseMpd(xml);"
            echo "console.log(mpd.periods[0].adaptationSets[0].representations);"
            echo ""
            echo "const playlist = parseHlsPlaylist(m3u8Text);"
            echo "if (playlist.kind === 'master') {"
            echo "  for (const variant of playlist.variants) {"
            echo "    console.log(variant.bandwidth, variant.codecs, variant.resolution);"
            echo "  }"
            echo "}"
            echo '```'
            echo ""
            echo '**Stitch per-chunk manifests into one (chunked-encoding pipelines):**'
            echo ""
            echo '```ts'
            echo "import { concatMpdPeriods, concatHlsMediaPlaylists } from '@ahmedrowaihi/mediabunny';"
            echo ""
            echo "const { xml, totalDurationSeconds } = concatMpdPeriods(["
            echo "  { xml: chunk0Mpd, baseURL: 'chunks/0/' },"
            echo "  { xml: chunk1Mpd, baseURL: 'chunks/1/' },"
            echo "]);"
            echo ""
            echo "const { content } = concatHlsMediaPlaylists(["
            echo "  { content: chunk0Playlist, pathPrefix: 'chunks/0' },"
            echo "  { content: chunk1Playlist, pathPrefix: 'chunks/1' },"
            echo "]);"
            echo '```'
            echo ""
            echo '**HLS + DASH from one CMAF pass:**'
            echo ""
            echo '```ts'
            echo "import {"
            echo "  Output, BufferTarget,"
            echo "  AdaptiveOutputFormat, HlsOutputFormat, DashOutputFormat,"
            echo "} from '@ahmedrowaihi/mediabunny';"
            echo ""
            echo "const output = new Output({"
            echo "  format: new AdaptiveOutputFormat({"
            echo "    hls: new HlsOutputFormat({ /* ... */ }),"
            echo "    dash: new DashOutputFormat({ /* ... */ }),"
            echo "  }),"
            echo "  target: new BufferTarget(),"
            echo "});"
            echo '```'
            echo ""
            echo "### Fork commits ahead of upstream"
            echo ""
            git log "--pretty=format:- %s ([\`%h\`](https://github.com/${REPO}/commit/%H))" upstream/main..HEAD
            echo ""
            echo ""
            echo "### Fork feature index"
            echo ""
            echo "See [FORK.md](https://github.com/${REPO}/blob/${SHA}/FORK.md) for the categorised list of additions (DASH input, parser exports, concat APIs, etc.)."
          } > release-notes.md

      - name: Publish main package
        run: npm publish --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            --prerelease \
            --target "${{ github.sha }}"

      - name: Prune older beta releases (keep latest 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: 3
        run: |
          # gh release list returns prereleases in createdAt desc order. Slice off the newest
          # $KEEP via bash array indexing, delete the rest. Bash array slicing avoids the
          # fragile `env.X|tonumber` jq syntax that silently misbehaves across jq versions.
          mapfile -t betas < <(
            gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease) | .tagName'
          )
          echo "Found ${#betas[@]} prerelease(s); keeping newest ${KEEP}."
          if [ "${#betas[@]}" -le "${KEEP}" ]; then
            echo "Nothing to prune."
            exit 0
          fi
          for tag in "${betas[@]:${KEEP}}"; do
            echo "Pruning $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          done

      - name: Summary
        run: |
          {
            echo "## Published \`@ahmedrowaihi/mediabunny@${{ steps.ver.outputs.version }}\`"
            echo ""
            echo "- **npm dist-tag:** \`beta\`"
            echo "- **upstream base:** \`${{ steps.ver.outputs.upstream_sha }}\` (mediabunny \`${{ steps.ver.outputs.base }}\`)"
            echo "- **release:** https://github.com/${{ github.repository }}/releases/tag/v${{ steps.ver.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
